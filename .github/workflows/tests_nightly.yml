on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch to test. Defaults to the checkout of the triggering event.'
        type: string
        required: false
        default: ''

name: Test examples with nightly

# this cancels workflows currently in progress if you start a new one
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  test-examples:
    runs-on: ${{ matrix.operating-system }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-26.04, ubuntu-26.04-arm, macos-26-intel, macos-26]
    timeout-minutes: 90
    steps:
      # Each example is tested with the Roc nightly that it pins in its header,
      # ci_scripts/get_roc.sh downloads the nightlies that are needed.
      # Checkout the trusted ref from the triggering event context.
      # Do not checkout caller-provided refs in this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.operating-system, 'ubuntu-')
        run: sudo apt install -y expect

      - name: Install dependencies (macOS)
        if: startsWith(matrix.operating-system, 'macos-')
        run: |
          brew install expect

      - name: check that every example pins a Roc version
        run: ./ci_scripts/check_roc_version.sh

      - name: check if roc files are properly formatted
        run: ./ci_scripts/check_format.sh

      - run: ./ci_scripts/all_tests.sh
