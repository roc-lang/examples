on:
  pull_request:
  workflow_dispatch:

name: Test examples without nix

# this cancels workflows currently in progress if you start a new one
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  test-examples:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-24.04]
        # TODO re-enable all operating systems
        #operating-system: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: roc-lang/setup-roc@30ff82b396cbeb36a662a18f5c652773efb43e72
        with:
          # Installs the latest nightly from https://github.com/roc-lang/nightlies
          version: nightly-new-compiler

      - name: Run Roc
        run: roc version

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.operating-system, 'ubuntu-')
        run: sudo apt install -y expect

      - name: Install dependencies (macOS)
        if: startsWith(matrix.operating-system, 'macos-')
        run: |
          brew install expect
          brew install z3

      - name: check if roc files are properly formatted
        run: ROC=roc ./ci_scripts/check_format.sh

      - run: ROC=roc ./ci_scripts/all_tests.sh

      - name: Checks if every folder in examples is mentioned in ./examples/index.md
        run: bash ./ci_scripts/check_index.sh