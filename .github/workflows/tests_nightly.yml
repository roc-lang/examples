on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test. Defaults to the usual checkout for this event.'
        type: string
        required: false
        default: ''

name: Test examples with nightly

# this cancels workflows currently in progress if you start a new one
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  test-examples:
    runs-on: ${{ matrix.operating-system }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-26.04, ubuntu-26.04-arm, macos-26-intel, macos-26]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - id: roc-version
        run: echo "nightly-tag=$(<.roc-version)" >> "$GITHUB_OUTPUT"

      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Run Roc
        run: roc version

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.operating-system, 'ubuntu-')
        run: sudo apt install -y expect

      - name: Install dependencies (macOS)
        if: startsWith(matrix.operating-system, 'macos-')
        run: |
          brew install expect

      - name: check if roc files are properly formatted
        run: ROC=roc ./ci_scripts/check_format.sh

      - name: check that manifests use the pinned Roc version
        run: ./ci_scripts/check_roc_version.sh

      - run: ROC=roc ./ci_scripts/all_tests.sh

      - name: Checks if every folder in examples is mentioned in ./examples/index.md
        run: bash ./ci_scripts/check_index.sh
