on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch to test. Defaults to the checkout of the triggering event.'
        type: string
        required: false
        default: ''

name: Test examples with nightly

# this cancels workflows currently in progress if you start a new one
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  test-examples:
    runs-on: ${{ matrix.operating-system }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-26.04, ubuntu-26.04-arm, macos-26-intel, macos-26, windows-latest]
        include:
          # Git Bash has no expect, so Windows runs the scripts in the MSYS2 that comes with the runner.
          - operating-system: windows-latest
            shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    env:
      # Only used by the MSYS2 shell: stay in the checkout, and keep the PATH of the runner for jq and geckodriver.
      CHERE_INVOKING: 1
      MSYS2_PATH_TYPE: inherit
    steps:
      # Each example is tested with the Roc version that it pins in its header,
      # ci_scripts/get_roc.sh downloads the versions that are needed.
      # check_roc_nightly.yml passes the ref of the branch with the upgraded examples, without it
      # this would test the default branch instead. Checking out that ref is safe: nothing is
      # cached, so the checked out code cannot poison a cache of the default branch, and the job
      # only has read permissions. Workflows of other repos that call this one run in their own repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.operating-system, 'ubuntu-')
        run: sudo apt install -y expect

      - name: Install dependencies (macOS)
        if: startsWith(matrix.operating-system, 'macos-')
        run: |
          brew install expect

      - name: Install dependencies (Windows)
        if: startsWith(matrix.operating-system, 'windows-')
        run: pacman -Sy --noconfirm --needed expect unzip

      - name: check that every example pins a Roc version
        run: ./ci_scripts/check_roc_version.sh

      - name: check if roc files are properly formatted
        run: ./ci_scripts/check_format.sh

      - run: ./ci_scripts/all_tests.sh
