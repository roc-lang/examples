on:
  schedule:
    # Nightlies are published around 10:30 UTC, run after that.
    - cron: '0 11 * * *'
  workflow_dispatch:

name: Check Roc nightly

# only one run at a time, they all push to the same branch
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

# Do not add permissions here! Configure them at the job level!
permissions: {}

# The examples pin a Roc release (see CONTRIBUTING.md). This workflow tries to
# upgrade all examples to the latest nightly and runs the tests. Nothing is
# merged or opened when that works, a pull request is only opened when it fails.
env:
  BRANCH: roc-nightly-upgrade

jobs:
  bump:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      nightly-tag: ${{ steps.latest.outputs.nightly-tag }}
      changed: ${{ steps.upgrade.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # People may be fixing the examples on the branch of that pull request, do not overwrite their work.
      - name: Look for an open pull request
        id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ]; then
            echo "Pull request #$pr is still open, skipping."
          fi

      - name: Get the latest nightly tag
        id: latest
        if: steps.open-pr.outputs.pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nightly_tag="$(gh release view --repo roc-lang/nightlies --json tagName --jq .tagName)"
          echo "latest nightly is $nightly_tag"
          echo "nightly-tag=$nightly_tag" >> "$GITHUB_OUTPUT"

      - name: Pin the examples to the latest nightly
        id: upgrade
        if: steps.open-pr.outputs.pr == ''
        env:
          NIGHTLY_TAG: ${{ steps.latest.outputs.nightly-tag }}
        run: |
          ./ci_scripts/update_roc_version.sh "$NIGHTLY_TAG"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch
        if: steps.upgrade.outputs.changed == 'true'
        env:
          NIGHTLY_TAG: ${{ steps.latest.outputs.nightly-tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git commit --all --message "Upgrade examples to Roc $NIGHTLY_TAG"
          git push --force origin "$BRANCH"

  test:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests_nightly.yml
    with:
      # The env context is not available here, keep this the same as BRANCH.
      ref: roc-nightly-upgrade

  report:
    needs: [bump, test]
    if: always() && needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The upgrade works, so there is nothing to do and the branch is not needed.
      - name: Delete the branch
        if: needs.test.result == 'success'
        run: git push origin --delete "$BRANCH"

      - name: Open the pull request
        if: needs.test.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.bump.outputs.nightly-tag }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upgrade examples to Roc $NIGHTLY_TAG"
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Upgrading the examples to [\`$NIGHTLY_TAG\`](https://github.com/roc-lang/nightlies/releases/tag/$NIGHTLY_TAG) failed (\`$TEST_RESULT\`), see the [workflow run]($RUN_URL)." \
            "@Anton-4 this needs a look. Push fixes to this branch, merge it once the tests pass or close it to try again with the next nightly." \
            "This PR was created automatically by the \`Check Roc nightly\` workflow.")"

          gh pr create --head "$BRANCH" --title "$title" --body "$body"
