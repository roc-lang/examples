on:
  schedule:
    # Nightlies are published around 10:30 UTC, run after that.
    - cron: '0 11 * * *'
  workflow_dispatch:

name: Update Roc nightly

# only one update run at a time, they all push to the same branch
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

# Do not add permissions here! Configure them at the job level!
permissions: {}

env:
  BRANCH: update-roc-nightly

jobs:
  bump:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      nightly-tag: ${{ steps.latest.outputs.nightly-tag }}
      changed: ${{ steps.upgrade.outputs.changed }}
      summary: ${{ steps.upgrade.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt install -y expect

      - name: Get the latest nightly tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nightly_tag="$(gh release view --repo roc-lang/nightlies --json tagName --jq .tagName)"
          echo "latest nightly is $nightly_tag"
          echo "nightly-tag=$nightly_tag" >> "$GITHUB_OUTPUT"

      # Examples that do not work with the latest nightly yet, for example because
      # their platform was not updated, stay on the version they pin.
      - name: Upgrade the examples that work with the latest nightly
        id: upgrade
        env:
          NIGHTLY_TAG: ${{ steps.latest.outputs.nightly-tag }}
        run: |
          summary="$(./ci_scripts/upgrade_roc_nightly.sh "$NIGHTLY_TAG" | tail -n 2)"
          echo "$summary"

          {
            echo "summary<<EOF"
            echo "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if git diff --quiet; then
            echo "no example changed, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch
        if: steps.upgrade.outputs.changed == 'true'
        env:
          NIGHTLY_TAG: ${{ steps.latest.outputs.nightly-tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git commit --all --message "Upgrade examples to Roc $NIGHTLY_TAG"
          git push --force origin "$BRANCH"

  test:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests_nightly.yml
    with:
      # The env context is not available here, keep this the same as BRANCH.
      ref: update-roc-nightly

  pull-request:
    needs: [bump, test]
    if: always() && needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.bump.outputs.nightly-tag }}
          SUMMARY: ${{ needs.bump.outputs.summary }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TEST_RESULT" = "success" ]; then
            status=":white_check_mark: All tests passed with the upgraded examples."
          else
            status=":x: Tests did not pass (\`$TEST_RESULT\`), this needs a look before merging."
          fi

          title="Upgrade examples to Roc $NIGHTLY_TAG"
          body="$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Updates the \`roc\` pin in the header of the examples that work with [\`$NIGHTLY_TAG\`](https://github.com/roc-lang/nightlies/releases/tag/$NIGHTLY_TAG)." \
            "$SUMMARY" \
            "$status See the [workflow run]($RUN_URL) for details." \
            "This PR was created automatically by the \`Update Roc nightly\` workflow.")"

          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -z "$pr" ]; then
            gh pr create --head "$BRANCH" --title "$title" --body "$body"
          else
            gh pr edit "$pr" --title "$title" --body "$body"
          fi
